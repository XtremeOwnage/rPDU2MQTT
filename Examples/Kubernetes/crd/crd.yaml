apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rpduconfigs.rpdu2mqtt.xtremeownage.com
spec:
  group: rpdu2mqtt.xtremeownage.com
  scope: Namespaced
  names:
    plural: rpduconfigs
    singular: rpduconfig
    kind: RpduConfig
    shortNames:
    - rpdu
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Connected
      type: string
      jsonPath: .status.connected
    - name: Devices
      type: integer
      jsonPath: .status.deviceCount
    - name: LastPoll
      type: string
      jsonPath: .status.lastPoll
    - name: Update
      type: string
      jsonPath: .status.update.latest
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
            properties:
              MQTT:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  Credentials:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      Username:
                        type: string
                        description: Username to log in as
                      Password:
                        type: string
                        description: Password to login with
                    description: Optional credentials to connect to MQTT
                  ClientID:
                    type: string
                    description: The client-id used when connecting to MQTT.
                  ImportProfiles:
                    type: array
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        Name:
                          type: string
                          description: Name shown in the MQTT Import source list.
                        Filter:
                          type: string
                          description: "Subscription filter to browse, e.g. 'tele/#'. Narrow it: a broker's ACL may refuse '#'."
                        Pattern:
                          type: string
                          description: "Topic shape, with {device} and {measure} marking the parts to capture and '+' matching any single segment, e.g. 'tele/{device}/SENSOR/{measure}'. Both may share one segment where a publisher names its channel and its measure together: 'esphome/devices/+/sensor/{device}_{measure}/state' reads 'n30_2_1_current' as channel 'n30_2_1' measuring current. Where such a segment splits is decided by the Metrics map below, so a measure that itself contains the separator (apparent_power) still resolves."
                        JsonField:
                          type: string
                          description: Field holding the value when the payload is JSON — dotted for nesting. Leave blank when the payload is the bare number.
                        Metrics:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          additionalProperties:
                            type: string
                            enum:
                            - realpower
                            - apparentpower
                            - energy
                            - current
                            - voltage
                            - frequency
                            - powerfactor
                            - soc
                            - energy_d
                          description: Which captured {measure} supplies which metric. A measure that is not listed is ignored, so this is also the filter for the readings worth importing. Choose 'energy_d' for a counter the device zeroes each day (e.g. ESPHome's energy_d); it is imported as energy with a daily-reset counter.
                        Tags:
                          type: array
                          items:
                            type: string
                          description: Tags put on every node imported through this profile, on top of the tag typed on the MQTT Import page. Use them in a destination's tag filter to keep these readings from being exported back where they came from.
                    description: How to read another publisher's topics on the MQTT Import page, for publishers with no built-in profile (ESPHome and Z-Wave JS are built in). A profile says which topics to look at and what each one measures, so the page can offer them as energy-flow nodes. For a publisher sending 'tele/kitchen/SENSOR/Power', the pattern 'tele/{device}/SENSOR/{measure}' captures device 'kitchen' and measure 'Power', and a Metrics entry of Power -> realpower says what that measure is.
                  ParentTopic:
                    type: string
                    description: The parent topic for MQTT messages.
                  Connection:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      Scheme:
                        type: string
                        enum:
                        - ''
                        - mqtt
                        - mqtts
                        - ws
                        - wss
                        description: 'How to reach the broker: mqtt (plain TCP), mqtts (TLS), ws (WebSocket) or wss (WebSocket over TLS). Leave unset to infer from the port.'
                      Host:
                        type: string
                        description: Hostname or IP to connect to.
                      Port:
                        type: integer
                        description: The port to connect to.
                        minimum: 0
                        maximum: 65535
                      Timeout:
                        type: integer
                        description: Default connection timeout.
                        minimum: 1
                        maximum: 3600
                      ValidateCertificate:
                        type: boolean
                        description: Enables certificate validation
                    description: Connection details for MQTT Broker
                  PublishTimeoutSeconds:
                    type: integer
                    description: Seconds to wait for the broker to acknowledge a publish before abandoning it and failing the pass loudly. Stops one unacknowledged message from silently wedging publishing altogether.
                    minimum: 1
                    maximum: 600
                  KeepAlive:
                    type: integer
                    description: The keepalive interval for the MQTT connection in seconds.
                    minimum: 1
                    maximum: 2147483647
                  LastWill:
                    type: boolean
                    description: Publish a Last-Will message and set an availability topic on entities, so Home Assistant marks them unavailable immediately when the bridge disconnects. When off, entities instead rely on HomeAssistant.SensorExpireAfterSeconds (expire_after) to go unavailable.
                  MessageTimestamp:
                    type: string
                    enum:
                    - None
                    - UserProperty
                    - Payload
                    description: "Carry the time a measurement was read. 'None' (default) publishes exactly as before. 'UserProperty' adds an MQTT v5 'timestamp' property and leaves the payload alone — verify it against your broker first, since a broker or client that mishandles user properties on PUBLISH can drop the connection. 'Payload' publishes {\"value\": …, \"timestamp\": …} instead of a bare value (Home Assistant discovery adapts automatically)."
                description: MQTT Configuration
              Pdus:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                additionalProperties:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    Connection:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        Host:
                          type: string
                          description: Hostname or IP to connect to.
                        Port:
                          type: integer
                          description: The port to connect to.
                          minimum: 0
                          maximum: 65535
                        Timeout:
                          type: integer
                          description: Default connection timeout.
                          minimum: 1
                          maximum: 3600
                        Scheme:
                          type: string
                          enum:
                          - ''
                          - http
                          - https
                          description: Connection scheme used
                        ValidateCertificate:
                          type: boolean
                          description: Enables certificate validation
                      description: Connection details for PDU
                    Credentials:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        Username:
                          type: string
                          description: Username to log in as
                        Password:
                          type: string
                          description: Password to login with
                      description: PDU login used for write actions (outlet control). Can also be supplied via RPDU2MQTT_PDU_USERNAME / RPDU2MQTT_PDU_PASSWORD.
                    PollInterval:
                      type: integer
                      description: How often (seconds) to poll the PDU and publish readings.
                      minimum: 1
                      maximum: 2147483647
                    ActionsEnabled:
                      type: boolean
                      description: Allow the bridge to make changes on the PDU (e.g. toggle outlets). When off, no switches or other write controls are exposed to Home Assistant. Requires PDU credentials.
                    RemapModel:
                      type: boolean
                      description: Replace each outlet/group's Model (shown in the Home Assistant device info) with contextual text (e.g. parent PDU + name) instead of the PDU's hardware model.
                    RemapManufacturer:
                      type: boolean
                      description: Replace each entity's Manufacturer (shown in Home Assistant) with the entity type (Outlet, Group, etc.) instead of the hardware manufacturer.
                    EmonCmsTag:
                      type: string
                      description: "EmonCMS tag this PDU's feeds are filed under. Blank uses EmonCMS.Feeds.Tag. Placeholders: {device} (the PDU's name), {instance} (this entry's key), e.g. '{device}'."
                    EmonCmsVirtualTag:
                      type: string
                      description: "EmonCMS tag this PDU's virtual feeds are filed under. Blank uses EmonCMS.Feeds.Virtual.Tag. Placeholders: {device}, {instance}, e.g. '{device}-virtual'."
                description: PDU instances to bridge, keyed by instance name.
              HomeAssistant:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  DiscoveryEnabled:
                    type: boolean
                    description: Indicates whether Home Assistant discovery is enabled.
                  DiscoveryTopic:
                    type: string
                    description: The discovery topic for Home Assistant.
                  DiscoveryInterval:
                    type: integer
                    description: How often (seconds) to republish discovery. 0 = run once at startup until restarted.
                  DiscoveryRetain:
                    type: boolean
                    description: Whether discovery messages are retained on the broker.
                  SensorExpireAfterSeconds:
                    type: integer
                    description: expire_after (seconds) applied to sensors; after this long without an update Home Assistant marks them unavailable.
                  GroupMemberNameTemplate:
                    type: string
                    description: "Name template for a group's mirrored member switches. Placeholders: {device}, {outlet}, {number}, {group}."
                  GroupMemberObjectIdTemplate:
                    type: string
                    description: "Stable entity/object_id template for a group's mirrored member switches. Placeholders: {serial}, {number}, {device}, {group}."
                  EnergyDashboard:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      Enabled:
                        type: boolean
                        description: Sync the energy-flow hierarchy into HA's Energy Dashboard via its API. Requires Url + a long-lived access token.
                      NodeTags:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        properties:
                          Include:
                            type: array
                            items:
                              type: string
                            description: Only send nodes carrying at least one of these tags. Empty sends every node.
                          Exclude:
                            type: array
                            items:
                              type: string
                            description: Never send nodes carrying any of these tags. Takes precedence over Include.
                        description: Limit the Energy Dashboard sync to nodes with particular tags. Empty syncs every node. Filtering changes only what is sent — never a value, and never any other destination.
                      Url:
                        type: string
                        description: Home Assistant base URL, e.g. http://homeassistant.local:8123 .
                      Token:
                        type: string
                        description: Home Assistant long-lived access token (or set RPDU2MQTT_HASS_TOKEN).
                      EnergyMeasurementType:
                        type: string
                        description: Measurement type holding each entity's cumulative energy (kWh) — used to find the Energy Dashboard stat for each tier.
                      ExcludeDeviceKinds:
                        type: array
                        items:
                          type: string
                        description: "Node kinds to leave OUT of the Energy Dashboard's individual-devices list (they're sources/storage/pass-through, shown as the dashboard's grid/solar/battery sources instead). Default: grid, solar, battery, inverter. Empty list = export every tier."
                    description: Auto-configure Home Assistant's Energy Dashboard 'devices' (with upstream relationships) from the energy-flow hierarchy, via HA's WebSocket API.
                description: Home Assistant Configuration
              Overrides:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  PDU:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      ID:
                        type: string
                        description: Overridden ID
                      Name:
                        type: string
                        description: Overridden Name
                      Enabled:
                        type: boolean
                        description: Is this entity enabled?
                      Make:
                        type: string
                        description: Manufacturer shown in Home Assistant (e.g. 'Dell'). Applies to devices, outlets and groups.
                      Model:
                        type: string
                        description: Model shown in Home Assistant (e.g. 'PowerEdge R730xd'). Applies to devices, outlets and groups.
                    description: Allows overriding values for the rPDU2MQTT.
                  Devices:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    additionalProperties:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        Outlets:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          additionalProperties:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                            properties:
                              ID:
                                type: string
                                description: Overridden ID
                              Name:
                                type: string
                                description: Overridden Name
                              Enabled:
                                type: boolean
                                description: Is this entity enabled?
                              Make:
                                type: string
                                description: Manufacturer shown in Home Assistant (e.g. 'Dell'). Applies to devices, outlets and groups.
                              Model:
                                type: string
                                description: Model shown in Home Assistant (e.g. 'PowerEdge R730xd'). Applies to devices, outlets and groups.
                          description: Allows overriding values for individual outlets.
                        ID:
                          type: string
                          description: Overridden ID
                        Name:
                          type: string
                          description: Overridden Name
                        Enabled:
                          type: boolean
                          description: Is this entity enabled?
                        Make:
                          type: string
                          description: Manufacturer shown in Home Assistant (e.g. 'Dell'). Applies to devices, outlets and groups.
                        Model:
                          type: string
                          description: Model shown in Home Assistant (e.g. 'PowerEdge R730xd'). Applies to devices, outlets and groups.
                    description: Allows overriding configuration for individual devices.
                  Measurements:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    additionalProperties:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        ID:
                          type: string
                          description: Overridden ID
                        Name:
                          type: string
                          description: Overridden Name
                        Enabled:
                          type: boolean
                          description: Is this entity enabled?
                        Make:
                          type: string
                          description: Manufacturer shown in Home Assistant (e.g. 'Dell'). Applies to devices, outlets and groups.
                        Model:
                          type: string
                          description: Model shown in Home Assistant (e.g. 'PowerEdge R730xd'). Applies to devices, outlets and groups.
                    description: Allows overriding individual measurements
                  OneviewGroups:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      Measurements:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        additionalProperties:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          properties:
                            ID:
                              type: string
                              description: Overridden ID
                            Name:
                              type: string
                              description: Overridden Name
                            Enabled:
                              type: boolean
                              description: Is this entity enabled?
                            Make:
                              type: string
                              description: Manufacturer shown in Home Assistant (e.g. 'Dell'). Applies to devices, outlets and groups.
                            Model:
                              type: string
                              description: Model shown in Home Assistant (e.g. 'PowerEdge R730xd'). Applies to devices, outlets and groups.
                        description: Allows overriding individual measurements for groups
                      Overrides:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        additionalProperties:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          properties:
                            ID:
                              type: string
                              description: Overridden ID
                            Name:
                              type: string
                              description: Overridden Name
                            Enabled:
                              type: boolean
                              description: Is this entity enabled?
                            Make:
                              type: string
                              description: Manufacturer shown in Home Assistant (e.g. 'Dell'). Applies to devices, outlets and groups.
                            Model:
                              type: string
                              description: Model shown in Home Assistant (e.g. 'PowerEdge R730xd'). Applies to devices, outlets and groups.
                        description: Allows overriding group ID, Name, and enabled state.
                    description: Overrides specific to Oneview groups
                description: Overrides
              Debug:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  PublishMessages:
                    type: boolean
                    description: Actually publish messages to the broker. Turn off to dry-run the whole pipeline without sending anything.
                  PrintDiscovery:
                    type: boolean
                    description: Log the Home Assistant discovery JSON to the console (verbose; for troubleshooting discovery).
                description: Settings for debugging and diagnostics.
              Prometheus:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  Exporter:
                    type: boolean
                    description: Expose a /metrics endpoint for Prometheus to scrape.
                  NodeTags:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      Include:
                        type: array
                        items:
                          type: string
                        description: Only send nodes carrying at least one of these tags. Empty sends every node.
                      Exclude:
                        type: array
                        items:
                          type: string
                        description: Never send nodes carrying any of these tags. Takes precedence over Include.
                    description: Limit the energy-flow metrics to nodes with particular tags. Empty exposes every node. Filtering changes only what is scraped — never a value, and never any other destination.
                  Port:
                    type: integer
                    description: Port the /metrics endpoint listens on (Exporter).
                  MetricNameTemplate:
                    type: string
                    description: "Template for Prometheus metric names. Placeholders: {type}, {device}, {source} (a.k.a. {outlet}), {units}. e.g. 'rpdu2mqtt_{type}' -> rpdu2mqtt_realpower; 'pdu_{device}_{type}' -> pdu_rack_pdu_1_realpower. (device/source/units are also emitted as labels.)"
                  Labels:
                    type: array
                    items:
                      type: string
                      enum:
                      - device
                      - device_name
                      - source
                      - name
                      - number
                      - type
                      - type_name
                      - units
                      - instance
                      - hierarchy
                    description: "Labels attached to every exported metric. Available: device, device_name (the device's display name), source, name (the outlet/entity's display name), number, type, type_name (the measurement said in English, e.g. 'Real Power'), units, instance (PDU instance key), hierarchy (the energy-flow tier feeding it). Changing this changes every metric's label set."
                  Pushgateway:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      Enabled:
                        type: boolean
                        description: Push metrics to a Pushgateway.
                      Url:
                        type: string
                        description: Pushgateway endpoint, e.g. http://pushgateway:9091/metrics.
                      Job:
                        type: string
                        description: The 'job' label applied to pushed metrics.
                      IntervalSeconds:
                        type: integer
                        description: How often to push, in seconds. Falls back to the PDU poll interval when 0.
                    description: Push metrics to a Prometheus Pushgateway.
                description: Prometheus metrics exporter
              History:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  ValueFallback:
                    type: boolean
                    description: 'Let the history backend supply a value for any node nothing live is reporting. Off by default: a stored value is older than a live one, and for a node whose source has stopped it replaces an honest "no data" with a figure that looks current.'
                  Enabled:
                    type: boolean
                    description: Let the Flow and Energy pages show a past moment, read from Prometheus or EmonCMS.
                  Provider:
                    type: string
                    enum:
                    - ''
                    - prometheus
                    - emoncms
                    - homeassistant
                    description: "Which backend to read from: 'prometheus' or 'emoncms'."
                  PrometheusUrl:
                    type: string
                    description: Prometheus base URL to query, e.g. http://prometheus:9090 . This is the server that scrapes this bridge, not the /metrics endpoint it exposes.
                  ToleranceSeconds:
                    type: integer
                    description: How far either side of the requested moment to look for a sample, in seconds. A scrape or feed interval longer than this returns nothing rather than a value from a different time.
                    minimum: 1
                    maximum: 600
              EmonCMS:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  Enabled:
                    type: boolean
                    description: Push measurements to an EmonCMS server.
                  Transport:
                    type: string
                    enum:
                    - Http
                    - Mqtt
                    description: "How to deliver measurements: Http (input/post API) or Mqtt (publish to EmonCMS's MQTT input on the same broker)."
                  Url:
                    type: string
                    description: Base URL of the EmonCMS server, e.g. http://emoncms.example.com. (Http transport.)
                  ApiKey:
                    type: string
                    description: EmonCMS write API key (or set RPDU2MQTT_EMONCMS_APIKEY). (Http transport.)
                  Node:
                    type: string
                    description: EmonCMS input node name.
                  Path:
                    type: string
                    description: API path (relative to Url) that measurements are posted to. (Http transport.)
                  InputNameTemplate:
                    type: string
                    description: "Template for EmonCMS input keys. Placeholders: {device}, {source} (object-id form), {name} (formatted display name), {number} (outlet number), {type}, {units}. e.g. '{device}_{source}_{type}' -> rack_pdu_1_dell_md1200_realpower. Leave blank to use the full raw identifier."
                  ExportFlowNodes:
                    type: boolean
                    description: Also send each energy-flow node (panels, inverters, batteries, the grid) as its own input, not just the PDU measurements. This is what gives those nodes history to read back.
                  NodeTags:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      Include:
                        type: array
                        items:
                          type: string
                        description: Only send nodes carrying at least one of these tags. Empty sends every node.
                      Exclude:
                        type: array
                        items:
                          type: string
                        description: Never send nodes carrying any of these tags. Takes precedence over Include.
                    description: Limit the exported energy-flow nodes to particular tags. Empty sends every node. Filtering changes only what is sent — never a value, and never any other destination.
                  FlowInputNameTemplate:
                    type: string
                    description: "Template for an energy-flow node's EmonCMS input key. Placeholders: {node} (its id), {label}, {kind}, {metric}, {units}. e.g. '{node}_{metric}' -> solar_realpower. The history reader looks feeds up by this name."
                  MqttBaseTopic:
                    type: string
                    description: Base MQTT topic for EmonCMS's MQTT input (the {base} placeholder of MqttTopicTemplate). (Mqtt transport.)
                  MqttTopicTemplate:
                    type: string
                    description: "Template for the EmonCMS MQTT topic each JSON payload is published to. Placeholders: {base} (MqttBaseTopic), {node}, {device} (the PDU's name). Including {device} splits the export so each PDU publishes to its own topic instead of one combined payload, e.g. '{base}/{node}/{device}'. (Mqtt transport.)"
                  Feeds:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      AutoConfigure:
                        type: boolean
                        description: Create and maintain EmonCMS feeds from the exported inputs (takes effect without a restart).
                      Types:
                        type: array
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          properties:
                            Type:
                              type: string
                              enum:
                              - ''
                              - realpower
                              - energy
                              - energy_d
                              - apparentpower
                              - current
                              - voltage
                              - frequency
                              - powerfactor
                              description: The measurement type this applies to.
                            Enabled:
                              type: boolean
                              description: Build and maintain a feed for this type.
                            Calculation:
                              type: string
                              enum:
                              - PreferLocal
                              - ForceLocal
                              - ForceEmonCms
                              description: Where this type's value comes from.
                            Prefix:
                              type: string
                              description: 'Text placed before the feed name. Blank by default. Placeholders: {device}, {source}, {name}, {number}, {type}, {units}.'
                            Suffix:
                              type: string
                              description: 'Text placed after the feed name, which is where the type appears. Placeholders: {device}, {source}, {name}, {number}, {type}, {units}.'
                            Units:
                              type: string
                              description: The unit this feed is stored in.
                            Engine:
                              type: string
                              enum:
                              - MySQL
                              - PHPTimeSeries
                              - PHPFina
                              - VirtualFeed
                              description: Feed storage engine for this type. Blank inherits Feeds.Engine. PHPFina = fixed-interval, PHPTimeSeries = variable, MySQL = MySQL storage.
                            IntervalSeconds:
                              type: integer
                              description: Sample interval in seconds for this type's feed.
                              minimum: 1
                              maximum: 86400
                        description: The supported measurement types. Each says whether it gets a feed, how that feed is named and stored, and whether EmonCMS derives it.
                      Engine:
                        type: string
                        enum:
                        - MySQL
                        - PHPTimeSeries
                        - PHPFina
                        - VirtualFeed
                        description: Default feed storage engine, for types that don't set their own. PHPFina = fixed-interval time series, PHPTimeSeries = variable interval, MySQL = MySQL storage (no phpfina files).
                      IntervalSeconds:
                        type: integer
                        description: Default sample interval in seconds for a fixed-interval feed, for types that don't set their own.
                        minimum: 1
                        maximum: 86400
                      Tag:
                        type: string
                        description: The EmonCMS tag (group) new feeds are filed under. Blank uses the input node name.
                      StorageNameTemplate:
                        type: string
                        description: 'Template for the storage-feed name, without the type — each type appends its own suffix. Use only stable placeholders ({device}, {source}, {number}) so the name never changes on a rename. Placeholders: {device}, {source}, {name}, {number}, {units}.'
                      Virtual:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        properties:
                          Enabled:
                            type: boolean
                            description: Create a friendly-named virtual feed for each storage feed, sourced from it (source_feed process).
                          NameTemplate:
                            type: string
                            description: "Template for the friendly virtual-feed name. {name} is the source's display name, so these can change freely without touching the stable storage feeds. Placeholders: {device}, {source}, {name}, {number}, {type}, {units}."
                          Tag:
                            type: string
                            description: The EmonCMS tag (group/node) virtual feeds are filed under — set this to keep the friendly virtual feeds separate from the storage feeds. Blank uses the main Feeds tag.
                        description: Optionally create friendly-named virtual feeds that source from the stable storage feeds — so dashboards get nice names while the underlying feeds stay idempotent.
                    description: Automatically create and maintain EmonCMS feeds from the exported inputs. (Http transport; needs a read/write API key.)
                  Source:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      PollIntervalSeconds:
                        type: integer
                        description: How often to read the bound feeds' current values, in seconds. One request per poll however many feeds are bound.
                        minimum: 5
                        maximum: 3600
                    description: Read EmonCMS feeds back as live values for energy-flow nodes (bind a node's source with Type 'emoncms').
                description: EmonCMS exporter
              Logging:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  LogFilePath:
                    type: string
                  Console:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      Severity:
                        type: string
                        enum:
                        - Verbose
                        - Debug
                        - Information
                        - Warning
                        - Error
                        - Fatal
                      Format:
                        type: string
                      Enabled:
                        type: boolean
                  File:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      Path:
                        type: string
                      FileRollover:
