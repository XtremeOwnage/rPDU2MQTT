{{- /*
  One all-in-one Deployment. v4 coordinates within one process, so this is meant to run a single replica:
  a second one polls the same PDUs and publishes the same output. The split.enabled path still renders one
  Deployment per role (worker/api/ui) for anyone who wants tiers (#179) — only the worker produces data.
*/}}
{{- $multi := gt (int .Values.replicaCount) 1 }}
{{- /* A graceful rollout (#506): the replacement comes up and is Ready before the old pod is stopped. Two
       processes then run at once, so it needs the leader lease, which is kept in the cache — without one it
       is Recreate, as before. A ReadWriteOncePod volume cannot be mounted by a second pod at all. */}}
{{- $cacheOn := or .Values.valkey.enabled (dig "Cache" "Enabled" false .Values.config) }}
{{- $podOnly := or (and .Values.history.persistence.enabled (eq .Values.history.persistence.accessMode "ReadWriteOncePod"))
                   (and .Values.floorPlans.persistence.enabled (eq .Values.floorPlans.persistence.accessMode "ReadWriteOncePod")) }}
{{- $graceful := and .Values.gracefulRollout.enabled $cacheOn (not $podOnly) }}
{{- $roles := list (dict "suffix" "" "role" "" "component" "" "replicas" .Values.replicaCount "strategy" (ternary "RollingUpdate" "Recreate" (or $multi $graceful)) "lease" $graceful) }}
{{- if .Values.split.enabled }}
{{- $roles = list
      (dict "suffix" "-worker" "role" "worker" "component" "worker" "replicas" (.Values.split.worker.replicaCount | int) "strategy" (ternary "RollingUpdate" "Recreate" $graceful) "lease" $graceful)
      (dict "suffix" "-api"    "role" "api"    "component" "api"    "replicas" (.Values.split.api.replicaCount    | int) "strategy" "RollingUpdate" "lease" false)
      (dict "suffix" "-ui"     "role" "ui"     "component" "ui"     "replicas" (.Values.split.ui.replicaCount     | int) "strategy" "RollingUpdate" "lease" false) }}
{{- end }}
{{- /* The operator (#210) manages this release's own Deployment; run it as its own single-replica process. */}}
{{- if .Values.operator.enabled }}
{{- $roles = append $roles (dict "suffix" "-operator" "role" "operator" "component" "operator" "replicas" 1 "strategy" "Recreate" "lease" false) }}
{{- end }}
{{- range $r := $roles }}
{{- /* Plan images are served by whichever process runs the GUI. */}}
{{- $plans := and $.Values.floorPlans.persistence.enabled (or (eq $r.component "") (eq $r.component "ui")) }}
{{- /* The readings are written by the process that polls and read by the one serving the GUI, so both
       carry the volume; with a single-writer access mode a split deployment needs a shared class. */}}
{{- $history := $.Values.history.persistence.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rpdu2mqtt.fullname" $ }}{{ $r.suffix }}
  labels:
    {{- include "rpdu2mqtt.labels" $ | nindent 4 }}
    {{- with $r.component }}
    app.kubernetes.io/component: {{ . }}
    {{- end }}
spec:
  replicas: {{ $r.replicas }}
  strategy:
    type: {{ $r.strategy }}
    {{- if eq $r.strategy "RollingUpdate" }}
    # The replacement is Ready before the old pod is told to stop.
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "rpdu2mqtt.selectorLabels" $ | nindent 6 }}
      {{- with $r.component }}
      app.kubernetes.io/component: {{ . }}
      {{- end }}
  template:
    metadata:
      annotations:
        # Roll the pod when the rendered config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rpdu2mqtt.selectorLabels" $ | nindent 8 }}
        {{- with $r.component }}
        app.kubernetes.io/component: {{ . }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "rpdu2mqtt.serviceAccountName" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $.Chart.Name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or (include "rpdu2mqtt.hasSecret" $) $.Values.kubernetesConfigSource.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "rpdu2mqtt.secretName" $ }}
                optional: true
          {{- end }}
          env:
            {{- with $r.role }}
            - name: RPDU2MQTT_ROLE
              value: {{ . | quote }}
            {{- end }}
            - name: RPDU2MQTT_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if $r.lease }}
            # Only the holder of the leader lease polls, publishes and records, so the old and new pod of a
            # rolling update never both do (#506). A restart from the GUI rolls this Deployment.
            - name: RPDU2MQTT_LEADER_LEASE
              value: "true"
            - name: RPDU2MQTT_DEPLOYMENT
              value: {{ printf "%s%s" (include "rpdu2mqtt.fullname" $) $r.suffix | quote }}
            {{- if $.Values.valkey.enabled }}
            # Used only when the configuration does not enable the Cache itself.
            - name: RPDU2MQTT_LEADER_LEASE_CONNECTION
              value: {{ printf "%s-valkey:6379" (include "rpdu2mqtt.fullname" $) | quote }}
            {{- end }}
            {{- end }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RPDU2MQTT_IMAGE
              value: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
            {{- if $plans }}
            # Floor plan images live here, outside the configuration.
            - name: RPDU2MQTT_PLANS_DIRECTORY
              value: {{ $.Values.floorPlans.mountPath | quote }}
            {{- end }}
            {{- if $history }}
            # Where the bridge keeps its own readings, unless the configuration names somewhere itself.
            - name: RPDU2MQTT_HISTORY_DIRECTORY
              value: {{ $.Values.history.mountPath | quote }}
            {{- end }}
            {{- if $.Values.kubernetesConfigSource.enabled }}
            - name: RPDU2MQTT_CONFIG_SOURCE
              value: k8s
            - name: RPDU2MQTT_CR_NAME
              value: {{ include "rpdu2mqtt.crName" $ | quote }}
            # Companion Secret the GUI writes credentials into (kept out of the CR spec).
            - name: RPDU2MQTT_SECRET_NAME
              value: {{ include "rpdu2mqtt.secretName" $ | quote }}
            - name: RPDU2MQTT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- /* The container's own clock. Unset, a container runs in UTC: log lines, and anything the
                   bridge formats in local time, are then hours from the operator's clock. The energy day
                   boundary is NOT this — that is EnergyFlow.Aggregation.PeriodTimeZone, deliberately
                   configuration rather than an accident of the container's environment. */}}
            {{- with $.Values.timeZone }}
            - name: TZ
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- if dig "Gui" "Enabled" false $.Values.config }}
            - name: gui
              containerPort: {{ dig "Gui" "Port" 8080 $.Values.config }}
            {{- end }}
            {{- if (include "rpdu2mqtt.apiEnabled" $) }}
            - name: api
              containerPort: {{ include "rpdu2mqtt.apiPort" $ }}
            {{- end }}
            {{- if (include "rpdu2mqtt.metricsEnabled" $) }}
            - name: metrics
              containerPort: {{ include "rpdu2mqtt.metricsPort" $ }}
            {{- end }}
            {{- if dig "Health" "Enabled" true $.Values.config }}
            - name: health
              containerPort: {{ dig "Health" "Port" 8081 $.Values.config }}
            {{- end }}
          {{- if and $.Values.healthProbes.enabled (dig "Health" "Enabled" true $.Values.config) }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ dig "Health" "Port" 8081 $.Values.config }}
            {{- with $.Values.healthProbes.liveness }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ dig "Health" "Port" 8081 $.Values.config }}
            {{- with $.Values.healthProbes.readiness }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if or (not $.Values.kubernetesConfigSource.enabled) $.Values.plugins.enabled $plans }}
          volumeMounts:
            {{- if not $.Values.kubernetesConfigSource.enabled }}
            - name: config
              mountPath: /config
              readOnly: true
            {{- end }}
            {{- if $.Values.plugins.enabled }}
            # Plugin assemblies. Read-only: nothing in the bridge writes here, and a plugin directory the
            # workload can write to is a way to change what code runs without changing the image.
            - name: plugins
              mountPath: /app/plugins
              readOnly: true
            {{- end }}
            {{- if $plans }}
            - name: plans
              mountPath: {{ $.Values.floorPlans.mountPath }}
            {{- end }}
            {{- if $history }}
            - name: history
              mountPath: {{ $.Values.history.mountPath }}
            {{- end }}
          {{- end }}
          {{- $res := $.Values.resources }}
          {{- if $r.component }}{{ $res = (index $.Values.split $r.component).resources | default $.Values.resources }}{{ end }}
          {{- with $res }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or (not $.Values.kubernetesConfigSource.enabled) $.Values.plugins.enabled $plans }}
      volumes:
        {{- if not $.Values.kubernetesConfigSource.enabled }}
        - name: config
          configMap:
            name: {{ include "rpdu2mqtt.fullname" $ }}
        {{- end }}
        {{- if $.Values.plugins.enabled }}
        - name: plugins
          {{- toYaml $.Values.plugins.volume | nindent 10 }}
        {{- end }}
        {{- if $plans }}
        - name: plans
          persistentVolumeClaim:
            claimName: {{ $.Values.floorPlans.persistence.existingClaim | default (printf "%s-plans" (include "rpdu2mqtt.fullname" $)) }}
        {{- end }}
        {{- if $history }}
        - name: history
          persistentVolumeClaim:
            claimName: {{ $.Values.history.persistence.existingClaim | default (printf "%s-history" (include "rpdu2mqtt.fullname" $)) }}
        {{- end }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* A ReadWriteOnce volume is attached to one node, and a surge pod scheduled on another cannot mount
             it, so the rollout would stall. Keep this Deployment's pods on one node; the first pod is free to
             land anywhere. Set affinity yourself to replace this. */}}
      {{- $rwo := or (and $history (eq $.Values.history.persistence.accessMode "ReadWriteOnce"))
                     (and $plans (eq $.Values.floorPlans.persistence.accessMode "ReadWriteOnce")) }}
      {{- if $.Values.affinity }}
      affinity:
        {{- toYaml $.Values.affinity | nindent 8 }}
      {{- else if and $r.lease $rwo }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "rpdu2mqtt.selectorLabels" $ | nindent 18 }}
                  {{- with $r.component }}
                  app.kubernetes.io/component: {{ . }}
                  {{- end }}
      {{- end }}
{{- end }}
