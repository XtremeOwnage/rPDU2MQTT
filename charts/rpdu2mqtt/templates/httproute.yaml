{{- if .Values.httpRoute.enabled }}
{{- $fullName := include "rpdu2mqtt.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "rpdu2mqtt.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- /* Webhook-defaulted fields are written out so GitOps tools don't report permanent drift. */}}
  {{- $parents := list }}
  {{- range .Values.httpRoute.parentRefs }}
  {{- $parents = append $parents (merge (dict) . (dict "group" "gateway.networking.k8s.io" "kind" "Gateway")) }}
  {{- end }}
  parentRefs:
    {{- toYaml $parents | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.httpRoute.rules }}
    {{- toYaml .Values.httpRoute.rules | nindent 4 }}
    {{- else }}
    {{- /* No paths: everything to the GUI Service, unvalidated as before. */}}
    {{- $paths := .Values.httpRoute.paths | default (list (dict "path" "/" "default" true)) }}
    {{- if .Values.httpRoute.mcp }}
    {{- $paths = prepend $paths (dict "path" "/mcp" "service" "api") }}
    {{- end }}
    {{- range $paths }}
    {{- $backend := dict "root" $ "service" (default "gui" .service) }}
    - matches:
        - path:
            type: {{ default "PathPrefix" .type }}
            value: {{ .path | quote }}
      backendRefs:
        - group: ""
          kind: Service
          {{- if .default }}
          name: {{ $fullName }}-gui
          port: {{ dig "Gui" "Port" 8080 $.Values.config }}
          {{- else }}
          name: {{ include "rpdu2mqtt.backendService" $backend }}
          port: {{ include "rpdu2mqtt.backendPort" $backend }}
          {{- end }}
          weight: 1
    {{- end }}
    {{- end }}
{{- end }}
