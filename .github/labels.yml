# Source of truth for repository labels. Applied by the "Sync Labels" workflow.
# Every PR carries exactly one kind/* label, matching its title prefix (see CONTRIBUTING.md).

- name: kind/feature
  color: "1d76db"
  description: "New functionality. PR prefix: [Feature]"
- name: kind/bug
  color: "d73a4a"
  description: "Something is not working as intended. PR prefix: [Bug]"
- name: kind/major
  color: "b60205"
  description: "Breaking change; requires a major version bump. PR prefix: [Major]"
- name: kind/chore
  color: "c5def5"
  description: "Refactoring, tests, CI, build and housekeeping. PR prefix: [Chore]"
- name: kind/documentation
  color: "0075ca"
  description: "Documentation only. PR prefix: [Docs]"
- name: kind/dependency
  color: "0366d6"
  description: "Dependency updates. PR prefix: [Deps]"
- name: kind/support
  color: "d876e3"
  description: "Questions and support requests (issues only)."

- name: needs-triage
  color: "fbca04"
  description: "New issue awaiting review."
- name: needs-info
  color: "fef2c0"
  description: "Waiting on more information from the reporter."

- name: priority/high
  color: "e99695"
  description: "Important; should be addressed soon."
- name: priority/low
  color: "c2e0c6"
  description: "Nice to have."

- name: lifecycle/stale
  color: "ededed"
  description: "Inactive; will be closed if nothing changes."
- name: lifecycle/frozen
  color: "5319e7"
  description: "Never auto-closed for inactivity."

- name: good first issue
  color: "7057ff"
  description: "Good entry point for newcomers."
- name: help wanted
  color: "008672"
  description: "Maintainers would welcome help or input."
