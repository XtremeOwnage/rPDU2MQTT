name: Sync Labels

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview changes without applying them"
        required: false
        default: true
        type: boolean
      delete-other:
        description: "Delete labels not defined in .github/labels.yml"
        required: false
        default: false
        type: boolean

jobs:
  sync-labels:
    name: Sync Labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          dry-run: ${{ inputs.dry-run }}
          delete-other-labels: ${{ inputs.delete-other }}
