name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Branch pushes only. A pull_request run built the whole image and then threw it away — `push:` below is
# false for pull_request events, so it published nothing — while the push event for the same commit built
# and published it. Two image builds per commit, one of them for nothing.
#
# Branches stay in: the image from a branch push is what gets deployed to test a change, so this is the run
# that has to keep working.
on:
  workflow_dispatch:
  push:
    branches:
        - '**'
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]

# A second push to the same branch makes the first image obsolete before it is finished. Releases and main
# are never cancelled — those images are the ones people pull by tag.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Use the Docker Engine's built-in BuildKit (driver: docker) instead of the
      # docker-container driver, which would pull moby/buildkit from Docker Hub
      # (unreliable here). Base images come from MCR, so no Docker Hub access is needed.
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0
        with:
          driver: docker

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute a human-readable, traceable app version that gets stamped into the binary
      # (surfaced in the GUI / MQTT discovery / heartbeat). Releases (v*.*.* tags) get the
      # clean semver; every other build gets a pre-release string carrying the branch, the
      # run number, and the short commit so a running instance maps back to a specific build.
      - name: Compute app version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            value="${GITHUB_REF_NAME#v}"
          else
            ref_slug="$(echo "${GITHUB_REF_NAME}" | tr '/_' '--' | tr -cd 'A-Za-z0-9.-')"
            value="0.0.0-${ref_slug}.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}"
          fi
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "App version: ${value}"

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is managed explicitly below (release-only), never auto-applied to prereleases.
          flavor: |
            latest=false
          # Tagging strategy (see issue #212):
          #   Release tag vX.Y.Z (non-prerelease):
          #     X.Y.Z, X.Y, X  -> pin to an exact/minor/major line and follow updates
          #     latest, stable, release -> always the newest stable release
          #   main branch:            edge, main, unstable, dev    (bleeding edge, may be unstable)
          #   any other branch:       <branch-name>, unstable, dev (work in progress, from any branch)
          #   pull request:           pr-<n>
          #
          # 'unstable' and 'dev' both mean work-in-progress, so both point at the newest build from ANY
          # branch, main included. They are how you get the last thing pushed without editing a manifest
          # per branch, and they move under you by design.
          #
          # What they are NOT is a release channel. Anything you do not want replaced by an in-progress
          # branch should track a release tag ('stable' / 'latest' / vX.Y.Z) or, for bleeding edge that is
          # at least merged, 'main' or 'edge' — those two follow main alone. The earlier bug here was that
          # main published NEITHER of the moving tags, so :unstable meant "some branch" and never
          # "released"; 'main'/'edge' now cover that case explicitly.
          #
          # Every branch build is also addressable by its own name, for pinning one specific branch.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=release,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=edge,branch=main
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=raw,value=unstable,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=ref,event=branch
            type=ref,event=pr

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
