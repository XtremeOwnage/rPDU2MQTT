name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'rPDU2MQTT*/**'
      - 'plugins/**'
      - 'Examples/Kubernetes/crd/crd.yaml'
      - 'charts/**'
      - 'rPDU2MQTT.sln'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'rPDU2MQTT*/**'
      - 'plugins/**'
      - 'Examples/Kubernetes/crd/crd.yaml'
      - 'charts/**'
      - 'rPDU2MQTT.sln'
      - '.github/workflows/ci.yml'
      - '!**/*.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --configuration Release

  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Broker
        run: sudo apt-get update -q && sudo apt-get install -y -q mosquitto && sudo systemctl start mosquitto
      - name: Start the bridge
        run: |
          dotnet publish rPDU2MQTT/rPDU2MQTT.csproj -c Release -o "$RUNNER_TEMP/app"
          mkdir -p "$RUNNER_TEMP/run" && cp rPDU2MQTT.Web/e2e/config.yaml "$RUNNER_TEMP/run/"
          cd "$RUNNER_TEMP/run" && nohup dotnet "$RUNNER_TEMP/app/rPDU2MQTT.dll" > bridge.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null -u admin:smoke http://127.0.0.1:18080/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/run/bridge.log"; exit 1
      - name: Smoke
        working-directory: rPDU2MQTT.Web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node smoke.mjs
      - if: failure()
        run: cat "$RUNNER_TEMP/run/bridge.log" || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: rPDU2MQTT.Web/e2e/out/
          if-no-files-found: ignore

  chart:
    name: Helm chart smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint charts/rpdu2mqtt
      - name: helm template (defaults)
        run: helm template rpdu2mqtt charts/rpdu2mqtt > /dev/null
      - name: helm template (CRD config source)
        run: helm template rpdu2mqtt charts/rpdu2mqtt --set kubernetesConfigSource.enabled=true > /dev/null
      - name: helm template (plugins)
        run: |
          helm template rpdu2mqtt charts/rpdu2mqtt --set plugins.enabled=true | grep -q 'mountPath: /app/plugins'
          helm template rpdu2mqtt charts/rpdu2mqtt --set plugins.enabled=true --set kubernetesConfigSource.enabled=true \
            | grep -q 'mountPath: /app/plugins' 

      - name: helm template (split roles)
        run: |
          out=$(helm template rpdu2mqtt charts/rpdu2mqtt --set split.enabled=true \
            --set config.Gui.Enabled=true --set config.Prometheus.Exporter=true)
          roles=$(echo "$out" | grep -cE '^  name: rpdu2mqtt-(worker|api|ui)$')
          [ "$roles" = 3 ] || { echo "expected 3 role Deployments, found $roles"; exit 1; }
          for role in worker api ui; do
            echo "$out" | grep -q "name: rpdu2mqtt-$role$" || { echo "missing $role Deployment"; exit 1; }
            echo "$out" | grep -q "value: \"$role\"" || { echo "missing RPDU2MQTT_ROLE=$role"; exit 1; }
          done

      - name: helm template (no cluster coordination)
        run: |
          for args in "" "--set split.enabled=true" "--set operator.enabled=true" "--set replicaCount=3" \
                      "--set networkPolicy.enabled=true --set networkPolicy.restrictEgress=true"; do
            out=$(helm template rpdu2mqtt charts/rpdu2mqtt $args --include-crds)
            echo "$out" | grep -iq 'orleans' && { echo "clustering config came back with [$args]"; exit 1; }
            echo "$out" | grep -Eq 'containerPort: (11111|30000)|port: (11111|30000)' \
              && { echo "silo ports came back with [$args]"; exit 1; }
          done
          exit 0

      - name: helm template (graceful rollout)
        run: |
          main() { helm template rpdu2mqtt charts/rpdu2mqtt "$@" | awk '/^kind: Deployment/{d=1} d&&/^  name: rpdu2mqtt$/{p=1} p&&/^---/{exit} p'; }
          out=$(main)
          echo "$out" | grep -q 'type: RollingUpdate' || { echo "default should roll"; exit 1; }
          echo "$out" | grep -q 'maxUnavailable: 0' || { echo "the old pod must stay until the new one is Ready"; exit 1; }
          echo "$out" | grep -q 'RPDU2MQTT_LEADER_LEASE$' || { echo "a rolling pod must take the leader lease"; exit 1; }
          echo "$out" | grep -q 'podAffinity' || { echo "a ReadWriteOnce volume needs the pods on one node"; exit 1; }
          for args in "--set valkey.enabled=false" "--set gracefulRollout.enabled=false" \
                      "--set history.persistence.accessMode=ReadWriteOncePod"; do
            out=$(main $args)
            echo "$out" | grep -q 'type: Recreate' || { echo "expected Recreate with [$args]"; exit 1; }
            echo "$out" | grep -q 'RPDU2MQTT_LEADER_LEASE' && { echo "no lease expected with [$args]"; exit 1; }
          done
          exit 0

      - name: helm template (scheduled restart)
        run: |
          out=$(helm template rpdu2mqtt charts/rpdu2mqtt)
          echo "$out" | grep -q 'kind: CronJob' && { echo "CronJob should not render by default"; exit 1; }

          out=$(helm template rpdu2mqtt charts/rpdu2mqtt --set autoRestart.enabled=true --set autoRestart.schedule='30 3 * * 0')
          echo "$out" | grep -q 'kind: CronJob' || { echo "missing CronJob"; exit 1; }
          echo "$out" | grep -q 'schedule: "30 3 \* \* 0"' || { echo "schedule not applied"; exit 1; }
          echo "$out" | grep -q 'app.kubernetes.io/instance=rpdu2mqtt' || { echo "restart must be scoped by label"; exit 1; }
          echo "$out" | grep -q 'name: rpdu2mqtt-restart' || { echo "missing restart ServiceAccount/Role"; exit 1; }

      - name: helm template (CRD config source, unmanaged resource)
        run: |
          out=$(helm template rpdu2mqtt charts/rpdu2mqtt \
            --set kubernetesConfigSource.enabled=true --set kubernetesConfigSource.manageResource=false)
          echo "$out" | grep -q '^kind: RpduConfig' && { echo "RpduConfig should not be rendered"; exit 1; }
          echo "$out" | grep -q 'RPDU2MQTT_CONFIG_SOURCE' || { echo "app should still read from the CR"; exit 1; }
